<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#cf4520">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f5f2ea; --surface:#ffffff; --surface-2:#efeadf; --surface-3:#e4ddcc;
  --line:#ddd4bf; --text:#211d17; --text-dim:#77705f;
  --accent:#cf4520; --accent-ink:#ffffff; --accent-soft:#f6dccb;
  --accent-2:#146b63; --accent-2-soft:#d9ece8;
  --good:#2f7d43; --good-soft:#dcefe0; --warn:#9c6b0a; --danger:#b3261e;
  --pr:#9a6b00; --pr-soft:#f5e6c4; --cal-mark:#146b63;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow-1:0 1px 2px rgba(33,29,23,.07),0 1px 1px rgba(33,29,23,.05);
  --shadow-2:0 10px 28px rgba(33,29,23,.16);
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#131414; --surface:#1c1e1f; --surface-2:#232627; --surface-3:#2b2e30;
    --line:#34383a; --text:#eeece6; --text-dim:#9b9891;
    --accent:#ff7a45; --accent-ink:#1a1108; --accent-soft:#3c2418;
    --accent-2:#4fc3b8; --accent-2-soft:#173330;
    --good:#5cc27e; --good-soft:#1c3324; --warn:#e3b451; --danger:#ff6f66;
    --pr:#f2c14e; --pr-soft:#4a3a12; --cal-mark:#1c7a71;
    --shadow-1:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.25);
    --shadow-2:0 12px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#131414; --surface:#1c1e1f; --surface-2:#232627; --surface-3:#2b2e30;
  --line:#34383a; --text:#eeece6; --text-dim:#9b9891;
  --accent:#ff7a45; --accent-ink:#1a1108; --accent-soft:#3c2418;
  --accent-2:#4fc3b8; --accent-2-soft:#173330;
  --good:#5cc27e; --good-soft:#1c3324; --warn:#e3b451; --danger:#ff6f66;
  --pr:#f2c14e; --pr-soft:#4a3a12; --cal-mark:#1c7a71;
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.25);
  --shadow-2:0 12px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink); color:var(--text); font-family:var(--font-body);
  min-height:100dvh; display:flex; justify-content:center;
}
#app{
  width:100%; max-width:520px; min-height:100dvh; background:var(--surface);
  display:flex; flex-direction:column; position:relative;
  box-shadow:var(--shadow-2);
}
::selection{ background:var(--accent-soft); }
button{ font-family:inherit; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }
a{color:var(--accent);}
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px 12px;
}
.brand{ display:flex; align-items:center; gap:8px; }
.brand svg{ width:22px; height:22px; color:var(--accent); }
.brand-text{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  letter-spacing:.02em; text-transform:uppercase;
}
.topbar-right{ display:flex; align-items:center; gap:8px; }
.streak-chip{
  display:flex; align-items:center; gap:5px; background:var(--accent-soft);
  color:var(--accent); font-family:var(--font-mono); font-weight:600; font-size:13px;
  padding:5px 9px 5px 7px; border-radius:999px;
}
.streak-chip svg{ width:14px; height:14px; }
.brand-text, .streak-chip{ white-space:nowrap; }
@media (max-width:400px){ .streak-word{ display:none; } .topbar-right{ gap:6px; } }
.unit-toggle{
  display:flex; background:var(--surface-2); border-radius:999px; padding:2px;
  border:1px solid var(--line);
}
.unit-toggle button{
  border:none; background:transparent; color:var(--text-dim); font-size:12px;
  font-family:var(--font-mono); font-weight:600; padding:5px 9px; border-radius:999px;
  cursor:pointer;
}
.unit-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
.date-row{ padding:0 16px 14px; display:flex; align-items:baseline; justify-content:space-between; }
.date-row .today-date{ font-family:var(--font-display); font-size:26px; font-weight:600; text-transform:uppercase; letter-spacing:.01em; }
.date-row .today-sub{ color:var(--text-dim); font-size:13px; }

main#view{ flex:1; padding:16px 16px 100px; }
.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);
  font-weight:600; margin:0 0 10px;
}
.stack{ display:flex; flex-direction:column; gap:12px; }

.card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:14px;
}
.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:10px; padding:48px 20px; color:var(--text-dim);
}
.empty-state svg{ width:44px; height:44px; color:var(--text-dim); opacity:.6; }
.empty-state h3{ margin:2px 0 0; font-family:var(--font-display); font-size:18px; color:var(--text); text-transform:uppercase; letter-spacing:.02em; }
.empty-state p{ margin:0; font-size:14px; max-width:280px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:var(--radius-s); font-weight:600; font-size:14px;
  padding:10px 16px; cursor:pointer; font-family:var(--font-body);
}
.btn-accent{ background:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:var(--surface-3); color:var(--text); }
.btn-outline{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
.icon-btn{
  border:none; background:transparent; color:var(--text-dim); width:30px; height:30px;
  border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn:hover{ background:var(--surface-3); }
.icon-btn svg{ width:17px; height:17px; }

.exercise-card{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow-1); position:relative; transition:transform .15s ease; }
.exercise-card.dragging{ transition:none; z-index:5; box-shadow:var(--shadow-2); }
.exercise-card-head .drag-handle{ padding:10px 6px; margin:-6px -2px -6px -8px; }
.reorder-mode .sets-list, .reorder-mode .add-set-btn, .reorder-mode .exercise-hint,
.reorder-mode .copy-last-btn, .reorder-mode .pr-badge, .reorder-mode .builder-ex-targets{ display:none; }
.reorder-mode .exercise-card{ padding:8px 12px; }
.reorder-mode .exercise-card .muscle-icon-badge{ width:34px; height:34px; }
.reorder-mode .exercise-card .muscle-icon-badge svg{ width:22px; height:22px; }
.reorder-mode .exercise-card-head .remove-exercise,
.reorder-mode .exercise-card-head .editor-remove-exercise{ visibility:hidden; }
.reorder-mode .drag-handle{ color:var(--accent); }
.exercise-card-head{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
.exercise-card-body{ display:flex; align-items:center; gap:13px; flex:1; min-width:0; }
.exercise-card-text{ min-width:0; }
.exercise-name{ font-weight:700; font-size:15.5px; }
.exercise-meta{ font-size:12.5px; color:var(--accent-2); font-weight:600; margin-top:2px; }
.exercise-hint{ font-size:12.5px; color:var(--text-dim); margin-top:8px; font-family:var(--font-mono); }
.sets-list{ margin-top:12px; display:flex; flex-direction:column; gap:5px; }
.set-row{
  display:grid; grid-template-columns:24px 16px 1fr 22px 10px 1fr 28px 26px; align-items:center; gap:5px;
  padding:4px; border-radius:10px; border:1px solid transparent;
}
.set-check{
  appearance:none; -webkit-appearance:none; width:22px; height:22px; border-radius:6px;
  border:2px solid var(--line); background:var(--surface-2); cursor:pointer; margin:0; padding:0;
  display:inline-flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
}
.set-check:checked{ background:var(--accent-2); border-color:var(--accent-2); }
.set-check:checked::after{
  content:""; position:absolute; left:6px; top:2px; width:6px; height:11px;
  border:solid var(--surface); border-width:0 2px 2px 0; transform:rotate(45deg);
}
.set-row.set-done{ background:var(--accent-2-soft); border-color:var(--accent-2); }
.set-row.set-done .set-input{ border-color:var(--accent-2); background:var(--surface); color:var(--accent-2); }
.set-row.set-done .set-idx, .set-row.set-done .set-unit, .set-row.set-done .set-x{ color:var(--accent-2); }
.set-idx{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); text-align:center; }
.set-x{ text-align:center; color:var(--text-dim); font-size:13px; }
.set-input{
  width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  border-radius:8px; padding:8px 4px; font-family:var(--font-mono); font-size:15px;
  text-align:center; font-weight:600;
}
.set-unit{ font-size:11px; color:var(--text-dim); text-align:left; font-weight:600; }
.remove-set{ width:26px; height:26px; }
.add-set-btn{
  margin-top:10px; width:100%; border:1px dashed var(--line); background:transparent;
  color:var(--accent-2); border-radius:8px; padding:9px; font-weight:600; font-size:13.5px; cursor:pointer;
}
.complete-workout-btn{ display:flex; width:fit-content; margin:16px auto 0; padding:7px 14px; font-size:13px; }
.complete-workout-btn svg{ width:14px; height:14px; }
.cancel-workout-link{
  display:block; width:100%; text-align:center; background:none; border:none;
  color:var(--danger); font-size:13px; font-weight:600; padding:12px 0 4px; cursor:pointer;
}
.complete-banner{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--good-soft); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:14px; margin-bottom:14px;
}
.complete-banner-head{ display:flex; align-items:center; gap:10px; }
.complete-banner-head svg{ width:20px; height:20px; color:var(--good); flex-shrink:0; }
.complete-banner-title{ font-weight:700; font-size:14.5px; }
.complete-banner-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }

.fab{
  position:absolute; right:16px; bottom:88px; z-index:15;
  width:56px; height:56px; border-radius:50%; border:none; background:var(--accent);
  color:var(--accent-ink); box-shadow:var(--shadow-2); display:flex; align-items:center;
  justify-content:center; cursor:pointer;
}
.fab svg{ width:24px; height:24px; }

.tabbar{
  position:sticky; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(6,1fr);
  background:var(--surface); border-top:1px solid var(--line); padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.tab-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
  color:var(--text-dim); padding:6px 1px; cursor:pointer; font-size:10px; font-weight:600;
}
.tab-btn svg{ width:20px; height:20px; }
.tab-btn.active{ color:var(--accent); }

.sheet-overlay{
  position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; height:100%;
  background:rgba(20,17,12,.45); z-index:30;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-height:86%; background:var(--surface); border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; box-shadow:var(--shadow-2);
  animation:sheetUp .18s ease-out;
}
@keyframes sheetUp{ from{ transform:translateY(24px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
.sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 4px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 16px 10px; border-bottom:1px solid var(--line); }
.sheet-title{ font-family:var(--font-display); font-size:17px; text-transform:uppercase; letter-spacing:.02em; font-weight:600; }
.sheet-body{ overflow-y:auto; padding:12px 16px 18px; }
.sheet-foot{ padding:10px 16px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }

.search-input{
  width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:15px; margin-bottom:10px;
}
.chip-row{ display:flex; gap:7px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface-2); color:var(--text-dim);
  border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.ex-list{ display:flex; flex-direction:column; }
.ex-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); }
.ex-row:last-child{ border-bottom:none; }
.ex-row-body{ display:flex; align-items:center; gap:13px; flex:1; min-width:0; }
.ex-row-text{ min-width:0; }
.ex-row-name{ font-weight:600; font-size:14.5px; }
.ex-row-meta{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
.ex-add-btn{
  flex:0 0 auto; border:1px solid var(--accent); color:var(--accent); background:transparent;
  border-radius:999px; padding:7px 14px; font-weight:700; font-size:13px; cursor:pointer;
}
.ex-add-btn.added{ background:var(--good); border-color:var(--good); color:#fff; }
.ex-row-actions{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }
.no-results{ color:var(--text-dim); font-size:14px; padding:24px 4px; text-align:center; }
.muscle-icon-badge{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:52px; height:52px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
}
.muscle-icon-badge svg{ width:34px; height:34px; color:var(--accent); }
.muscle-icon-badge.mi-sm{ width:34px; height:34px; }
.muscle-icon-badge.mi-sm svg{ width:22px; height:22px; }
.muscle-icon-badge rect.mi-dim, .muscle-icon-badge circle.mi-dim{ fill:var(--text-dim); opacity:.4; }
.muscle-icon-badge path.mi-dim{ fill:none; stroke:var(--text-dim); stroke-width:1.6; opacity:.6; }
.muscle-icon-badge .mi-cut-line{ fill:none; stroke:var(--surface-2); stroke-width:1.3; }
.hist-ex-name-wrap{ display:flex; align-items:center; gap:6px; }

.custom-ex-toggle{
  width:100%; border:1px dashed var(--line); background:transparent; color:var(--accent-2);
  border-radius:10px; padding:11px; font-weight:600; font-size:13.5px; cursor:pointer; margin-top:10px;
}
.custom-ex-form{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; margin-top:10px; }
.field-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:600; margin-bottom:5px; display:block; }
.text-input{
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:15px;
}
.form-row{ margin-bottom:10px; }
.form-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.copy-last-btn{
  border:none; background:none; color:var(--accent-2); font-weight:600; font-size:12px;
  padding:3px 0 0; margin:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}

.program-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow-1); }
.program-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.program-name{ font-weight:700; font-size:16px; }
.program-meta{ font-size:12.5px; color:var(--text-dim); margin-top:3px; }
.program-actions{ display:flex; gap:8px; margin-top:12px; }
.program-actions .btn{ flex:1; }

.builder-ex-row{ padding:9px 0; border-bottom:1px solid var(--line); background:var(--surface); transition:transform .15s ease; position:relative; }
.builder-ex-row:last-child{ border-bottom:none; }
.builder-ex-row.dragging{ transition:none; z-index:5; box-shadow:var(--shadow-2); border-radius:10px; }
.builder-ex-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.builder-ex-name{ flex:1; font-weight:600; font-size:14px; display:flex; align-items:center; gap:7px; }
.drag-handle{
  background:none; border:none; padding:4px; margin:0 -2px 0 -6px; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; flex-shrink:0;
}
.drag-handle:active{ cursor:grabbing; color:var(--text); }
.drag-handle svg{ width:16px; height:16px; }
.builder-ex-targets{ display:flex; gap:16px; margin-top:7px; padding-left:44px; }
.stepper{ display:flex; align-items:center; gap:7px; }
.stepper button{ width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-weight:700; font-size:15px; line-height:1; cursor:pointer; }
.stepper span{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim); min-width:52px; text-align:center; }

.tag-pill{
  display:inline-flex; align-items:center; gap:4px; background:var(--accent-2-soft); color:var(--accent-2);
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
  margin-top:4px;
}
.pr-badge{
  display:inline-flex; align-items:center; gap:4px; background:var(--pr-soft); color:var(--pr);
  font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
  margin-top:8px;
}
.pr-badge svg{ width:12px; height:12px; }
.pr-mini{ display:inline-flex; color:var(--pr); width:13px; height:13px; margin-left:5px; vertical-align:-2px; }

.cal-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.cal-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; margin-top:14px; }
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-month-label{ font-family:var(--font-display); font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:.02em; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-grid.cal-weekdays{ margin-bottom:6px; }
.cal-wd{ text-align:center; font-size:11px; color:var(--text-dim); font-weight:700; }
.cal-cell{
  aspect-ratio:1; border:none; background:var(--surface); border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono);
  font-size:12.5px; color:var(--text); cursor:pointer; padding:0;
}
.cal-empty{ background:transparent; cursor:default; }
.cal-future{ opacity:.35; cursor:default; }
.cal-today{ box-shadow:inset 0 0 0 2px var(--accent); font-weight:700; }
.cal-selected{ box-shadow:inset 0 0 0 2px var(--text); }
.cal-today.cal-selected{ box-shadow:inset 0 0 0 2px var(--accent), inset 0 0 0 4px var(--text); }
.cal-has{ background:var(--cal-mark); color:#fff; font-weight:700; }
.cal-detail{ margin-top:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; }
.cal-detail-date{ font-weight:700; font-size:15px; margin-bottom:8px; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.01em; }
.pr-list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.pr-list-item:last-child{ border-bottom:none; }

async function createCustomExercise(name, muscle, equip){
  name = (name||"").trim();
  if(!name) return null;
  if(state.backend==="db" && dbNs){
    try{
      var ref = await customCol().add({name:name, muscle:muscle, equip:equip});
      var obj = {id:ref.id, name:name, muscle:muscle, equip:equip};
      EX_BY_ID[obj.id] = obj;
      if(!state.customExercises.some(function(x){ return x.id===obj.id; })){
        state.customExercises.push(obj);
      }
      return obj;
    }catch(e){ /* fall through to local */ }
  }
  var obj = {id:"custom-"+uid(), name:name, muscle:muscle, equip:equip};
  state.customExercises.push(obj);
  EX_BY_ID[obj.id] = obj;
  saveLocalCustomList();
  return obj;
}

var firstSnapshotHandled = false;
function refreshFromSnapshot(snap){
  var list = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
  list.sort(function(a,b){ return a.data.date < b.data.date ? 1 : -1; });
  state.sessions = list;
  var isFirst = !firstSnapshotHandled;
  if(isFirst){
    var found = list.find(function(s){ return s.data.date===todayKey(); });
    if(found && (!state.today || !state.today.exercises.length)){
      state.today = JSON.parse(JSON.stringify(found.data)); state.todayId = found.id;
    }
  } else if(state.today && state.today.date !== todayKey()){
    state.today = null; state.todayId = null; ensureToday();
  }
  if(isFirst || state.tab!=="log"){ renderAll(); } else { updateStreakChipOnly(); }
  firstSnapshotHandled = true;
}

async function initStorage(){
  loadLocal();
  loadLocalCustom();
  loadLocalPrograms();
  loadLocalHidden();
  ensureToday();
  renderAll();
  if(!window.claude || !window.claude.use){ state.backend="local"; return; }
  try{
    var ns = await window.claude.use("db");
    if(ns){
      dbNs = ns; state.backend = "db";
      sessionsCol().orderBy("date","desc").limit(200).onSnapshot(refreshFromSnapshot, function(){ state.backend="local"; loadLocal(); renderAll(); });
      customCol().limit(300).onSnapshot(refreshCustomFromSnapshot, function(){});
      programsCol().limit(100).onSnapshot(refreshProgramsFromSnapshot, function(){});
      hiddenExercisesDoc().onSnapshot(refreshHiddenFromSnapshot, function(){});
    }
  }catch(e){ /* stay on local */ }
}

var creatingTodayDoc = null;
async function commitToday(){
  if(!state.today) return;
  if(state.backend==="db" && dbNs){
    try{
      if(state.todayId){
        await sessionsCol().doc(state.todayId).set(state.today);
      } else {
        if(!creatingTodayDoc){
          creatingTodayDoc = sessionsCol().add(state.today).then(function(ref){ state.todayId = ref.id; creatingTodayDoc = null; });
        }
        await creatingTodayDoc;
        if(state.todayId){ await sessionsCol().doc(state.todayId).set(state.today); }
      }
    }catch(e){ state.backend="local"; saveLocalDoc(state.todayId||(state.todayId=uid()), state.today); }
  } else {
    if(!state.todayId) state.todayId = uid();
    saveLocalDoc(state.todayId, state.today);
  }
}

function isCounted(s){ return s.done!==false; }
function isCardioExercise(exId){

}
function formatSetsForDisplay(sets, cardio){
  return sets.map(function(st){
    var t = cardio ? (st.duration||0)+" min"+(st.distance?" · "+st.distance+" km":"") : fmtWeight(st.weight)+" "+unitLabel()+" × "+st.reps;
    return isCounted(st) ? t : '<span class="set-undone-text">'+t+"</span>";
  }).join(", ");
}

function lastEntryFor(exId, excludeToday){
  for(var i=0;i<state.sessions.length;i++){
    var s = state.sessions[i];
    if(excludeToday && s.id===state.todayId) continue;
    if(s.data.date===todayKey() && s.id!==state.todayId) continue;
    var ex = (s.data.exercises||[]).find(function(e){ return e.exerciseId===exId; });
    if(ex && ex.sets){
      var doneSets = ex.sets.filter(isCounted);
      if(doneSets.length){ return { date:s.data.date, sets:doneSets }; }
    }
  }
  return null;
}

function topSet(sets){
  return sets.filter(isCounted).reduce(function(best,s){ return (!best || s.weight>best.weight) ? s : best; }, null);
}
function volumeOf(sets){
  return sets.filter(isCounted).reduce(function(v,s){ return v + (s.reps||0)*(s.weight||0); }, 0);
}
function epley1RM(w,r){ return w*(1+r/30); }
function formatDuration(ms){
  if(!ms || ms<0) ms = 0;
  var totalMin = Math.round(ms/60000);
  if(totalMin<1) return "<1 min";
  var h = Math.floor(totalMin/60), m = totalMin%60;
  if(h>0) return h+"h "+m+"m";
  return m+" min";
}

function streakCount(){
  var days = {};
  state.sessions.forEach(function(s){ if((s.data.exercises||[]).length) days[s.data.date]=true; });
  if(state.today && state.today.exercises.length) days[todayKey()]=true;
  var d = new Date(); var n=0;
  if(!days[dateKey(d)]){ d.setDate(d.getDate()-1); }
  while(days[dateKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function longestStreak(){
  var days = {};
  state.sessions.forEach(function(s){ if((s.data.exercises||[]).length) days[s.data.date]=true; });
  if(state.today && state.today.exercises.length) days[todayKey()]=true;
  var dates = Object.keys(days).sort();
  var longest=0, run=0, prevDate=null;
  dates.forEach(function(k){
    var d = parseKey(k);
    if(prevDate && Math.round((d-prevDate)/86400000)===1){ run++; } else { run=1; }
    longest = Math.max(longest, run);
    prevDate = d;
  });
  return longest;
}

function baselineBestFor(exId){
  var bestWeight=0, bestReps=0;
  state.sessions.forEach(function(s){
    if(s.id===state.todayId) return;
    (s.data.exercises||[]).forEach(function(e){
      if(e.exerciseId!==exId) return;
      e.sets.forEach(function(set){
        if(!isCounted(set)) return;
        var w=set.weight||0, r=set.reps||0;
        if(w>bestWeight){ bestWeight=w; bestReps=r; }
        else if(w===bestWeight && r>bestReps){ bestReps=r; }
      });
    });
  });
  return { weight:bestWeight, reps:bestReps };
}

function prStatusFor(exId, sets){
  var baseline = baselineBestFor(exId);
  var best = topSet(sets);
  if(!best || !(best.weight>0)) return null;
  if(baseline.weight>0 && best.weight===baseline.weight && (best.reps||0)<=baseline.reps) return null;
  if(best.weight>baseline.weight) return { type:"weight", set:best };
  if(best.weight===baseline.weight && (best.reps||0)>baseline.reps) return { type:"reps", set:best };
  return null;
}

function checkForPR(idx){
  var ex = state.today.exercises[idx];
  var status = prStatusFor(ex.exerciseId, ex.sets);
  if(!status) return;
  var key = ex.exerciseId+":"+status.set.weight+":"+status.set.reps;
  if(state.prToasted[key]) return;
  state.prToasted[key] = true;
  var info = EX_BY_ID[ex.exerciseId];
  var label = status.type==="weight"
    ? fmtWeight(status.set.weight)+" "+unitLabel()+" × "+status.set.reps
    : fmtWeight(status.set.weight)+" "+unitLabel()+" × "+status.set.reps+" (most reps)";
  toast("New PR on "+(info?info.name:ex.name)+" — "+label);
}

function updatePRBadgeUI(idx){
  var card = document.querySelector('.exercise-card[data-idx="'+idx+'"]');
  if(!card) return;
  var ex = state.today.exercises[idx];
  var status = prStatusFor(ex.exerciseId, ex.sets);
  var existing = card.querySelector(".pr-badge");
  if(status){
    var label = status.type==="weight" ? "New weight PR" : "New rep PR";
    if(existing){ existing.innerHTML = icon("trophy")+label; }
    else {
      var meta = card.querySelector(".exercise-meta");
      var div = document.createElement("div");
      div.className = "pr-badge";
      div.innerHTML = icon("trophy")+label;
      meta.insertAdjacentElement("afterend", div);
    }
  } else if(existing){ existing.remove(); }
}

function computeAllPRs(){
  var bestWeight = {}, bestReps = {};
  var events = [];
  var chrono = allSessionsIncludingToday().slice().reverse();
  chrono.forEach(function(s){
    (s.data.exercises||[]).forEach(function(e){
      e.sets.forEach(function(set){
        if(!isCounted(set)) return;
        var w=set.weight||0, r=set.reps||0;
        if(w<=0) return;
        var id = e.exerciseId;
        if(bestWeight[id]===undefined || w>bestWeight[id]){
          events.push({date:s.data.date, exerciseId:id, type:"weight", weight:w, reps:r});
          bestWeight[id]=w; bestReps[id]=r;
        } else if(w===bestWeight[id] && r>(bestReps[id]||0)){
          events.push({date:s.data.date, exerciseId:id, type:"reps", weight:w, reps:r});
          bestReps[id]=r;
        }
      });
    });
  });
  return events;
}

function weekBounds(offsetWeeks){
  var d = new Date(); var day=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day-offsetWeeks*7);
  var start = new Date(d); var end = new Date(d); end.setDate(end.getDate()+6);
  return {start:start,end:end};
}
function inRange(k,start,end){ var d=parseKey(k); return d>=start && d<=end; }

function allSessionsIncludingToday(){
  var arr = state.sessions.slice();
  if(state.today && state.today.exercises.length && !state.todayId){ arr = [{id:"__today__",data:state.today}].concat(arr); }
  return arr;

function escHtml(s){

function recentEntriesFor(exId, max){
  var out = [];
  for(var i=0; i<state.sessions.length && out.length<max; i++){
    var s = state.sessions[i];
    if(s.id===state.todayId || s.data.date===todayKey()) continue;
    var ex = (s.data.exercises||[]).find(function(e){ return e.exerciseId===exId; });
    if(!ex) continue;
    var doneSets = (ex.sets||[]).filter(isCounted);
    if(doneSets.length) out.push({ date:s.data.date, programName:s.data.programName, sets:doneSets });
  }
  return out;
}

function fmtWeight(w){

  return round1(w);
}
function unitLabel(){ return state.unit; }

function svgLineChart(points, opts){
  opts = opts || {};
  var W=300,H=150,padL=34,padR=14,padT=16,padB=22;
  if(points.length===0){
    return '<svg viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" class="chart-label">No data yet</text></svg>';
  }
  if(points.length===1){ points = [points[0], points[0]]; }
  var ys = points.map(function(p){return p.y;});
  var maxY = Math.max.apply(null, ys), minY = Math.min.apply(null, ys);
  if(maxY===minY){ maxY = maxY + 1; minY = Math.max(0, minY-1); }
  var span = maxY-minY;
  minY -= span*0.12; maxY += span*0.12; span = maxY-minY;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  function xAt(i){ return padL + (points.length===1?0:i/(points.length-1))*innerW; }
  function yAt(v){ return padT + innerH - ((v-minY)/span)*innerH; }
  var d = points.map(function(p,i){ return (i===0?"M":"L")+xAt(i).toFixed(1)+","+yAt(p.y).toFixed(1); }).join(" ");
  var area = d + " L"+xAt(points.length-1).toFixed(1)+","+(padT+innerH)+" L"+xAt(0).toFixed(1)+","+(padT+innerH)+" Z";
  var grid = "";
  for(var g=0; g<=3; g++){ var gy = padT + innerH*g/3; grid += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'"/>'; }
  var yTop = (opts.fmt?opts.fmt(maxY):Math.round(maxY));
  var yBot = (opts.fmt?opts.fmt(minY):Math.round(minY));
  var labels = '<text x="4" y="'+(padT+4)+'" class="chart-label">'+yTop+'</text><text x="4" y="'+(padT+innerH)+'" class="chart-label">'+yBot+'</text>';
  var xFirst = '<text x="'+xAt(0)+'" y="'+(H-4)+'" class="chart-label" text-anchor="start">'+points[0].label+'</text>';
  var xLast = '<text x="'+xAt(points.length-1)+'" y="'+(H-4)+'" class="chart-label" text-anchor="end">'+points[points.length-1].label+'</text>';
  var dots = points.map(function(p,i){
    var isLast = i===points.length-1;
    return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.y).toFixed(1)+'" r="'+(isLast?4.2:2.6)+'" class="'+(isLast?'chart-dot-end':'chart-dot')+'"/>';
  }).join("");
  var endVal = opts.fmt ? opts.fmt(points[points.length-1].y) : points[points.length-1].y;
  var endLabel = '<text x="'+(xAt(points.length-1)-4)+'" y="'+(yAt(points[points.length-1].y)-9)+'" text-anchor="end" class="chart-endlabel">'+endVal+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">' +
    '<g class="chart-grid">'+grid+'</g>' +
    '<path class="chart-area" d="'+area+'"/>' +
    '<path class="chart-line" d="'+d+'"/>' +
    dots + labels + xFirst + xLast + endLabel +
    '</svg>';
}

function svgBarChart(points, opts){
  opts = opts || {};
  var W=300,H=140,padL=28,padR=10,padT=14,padB=22;
  if(points.length===0){
    return '<svg viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" class="chart-label">No data yet</text></svg>';
  }
  var maxY = Math.max.apply(null, points.map(function(p){return p.y;})) || 1;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  var n = points.length;
  var gap = 6, bw = Math.max(6,(innerW-gap*(n-1))/n);
  var bars = points.map(function(p,i){
    var h = maxY? (p.y/maxY)*innerH : 0;
    var x = padL + i*(bw+gap);
    var y = padT+innerH-h;
    return '<rect class="'+(p.y>0?'chart-bar':'chart-bar-muted')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="2.5"/>' +
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" class="chart-label">'+p.label+'</text>';
  }).join("");
  var topLabel = '<text x="4" y="'+(padT+4)+'" class="chart-label">'+(opts.fmt?opts.fmt(maxY):Math.round(maxY))+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">' + bars + topLabel + '</svg>';
}

    '<span class="set-idx">'+(si+1)+"</span>";

function renderProgress(){
  var weekCount = allSessionsIncludingToday().filter(function(s){ var b=weekBounds(0); return (s.data.exercises||[]).length && inRange(s.data.date,b.start,b.end); }).length;
  var totalCount = allSessionsIncludingToday().filter(function(s){ return (s.data.exercises||[]).length; }).length;
  var weekVol = 0;
  allSessionsIncludingToday().forEach(function(s){ var b=weekBounds(0); if(inRange(s.data.date,b.start,b.end)){ (s.data.exercises||[]).forEach(function(e){ weekVol += volumeOf(e.sets); }); } });
  var streak = streakCount();

  var weekPoints = [];
  for(var w=7; w>=0; w--){
    var b = weekBounds(w);
    var cnt = allSessionsIncludingToday().filter(function(s){ return (s.data.exercises||[]).length && inRange(s.data.date,b.start,b.end); }).length;
    weekPoints.push({ y:cnt, label: b.start.toLocaleDateString(undefined,{month:"numeric",day:"numeric"}) });
  }

  var exIdsLogged = {};
  allSessionsIncludingToday().forEach(function(s){ (s.data.exercises||[]).forEach(function(e){ exIdsLogged[e.exerciseId]=true; }); });
  var exOptions = Object.keys(exIdsLogged).map(function(id){ return EX_BY_ID[id]; }).filter(function(o){ return o && o.muscle!=="Cardio"; }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  if(!state.progressExId && exOptions.length) state.progressExId = exOptions[0].id;

  var exSection = "";
  if(exOptions.length){
    var chosen = state.progressExId;
    var histAsc = state.sessions.slice().reverse().concat(state.todayId?[]:(state.today&&state.today.exercises.length?[{id:"__today__",data:state.today}]:[]));
    var pts=[]; var volPts=[];
    histAsc.forEach(function(s){
      var e = (s.data.exercises||[]).find(function(x){ return x.exerciseId===chosen; });
      if(e && e.sets.length){
        var t = topSet(e.sets);
        if(t){
          pts.push({ y: fmtWeight(t.weight), label: fmtShort(s.data.date) });
          volPts.push({ y: Math.round(volumeOf(e.sets)*(state.unit==="lb"?2.20462:1)), label: fmtShort(s.data.date) });
        }
      }
    });
    pts = pts.slice(-20); volPts = volPts.slice(-20);
    var best = pts.length? pts[pts.length-1] : null;
    var oneRM = "—";
    if(best){
      var lastSets = null;
      for(var i=histAsc.length-1;i>=0;i--){
        var e2=(histAsc[i].data.exercises||[]).find(function(x){return x.exerciseId===chosen;});
        if(e2 && e2.sets.length && topSet(e2.sets)){ lastSets=e2.sets; break; }
      }
      if(lastSets){ var tp = topSet(lastSets); oneRM = round1(fmtWeight(epley1RM(tp.weight, tp.reps||1))) + " " + unitLabel(); }
    }
    exSection =
      '<div class="section-label" style="margin-top:22px">Exercise Progress</div>'+
      '<div class="select-wrap" style="margin-bottom:12px">'+
        '<select class="select-input" id="progressExSelect">'+
          exOptions.map(function(o){ return '<option value="'+o.id+'"'+(o.id===chosen?" selected":"")+'>'+o.name+"</option>"; }).join("")+
        "</select>"+
        '<svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'+
      "</div>"+
      '<div class="stack">'+
      '<div class="chart-card"><div class="chart-title">Top Set Weight ('+unitLabel()+')</div>'+svgLineChart(pts)+"</div>"+
      '<div class="stat-tile"><div class="stat-label">Estimated 1RM</div><div class="stat-value">'+oneRM+"</div></div>"+
      '<div class="chart-card"><div class="chart-title">Session Volume ('+unitLabel()+')</div>'+svgBarChart(volPts)+"</div>"+
      "</div>";
  } else {
    exSection = '<div class="empty-state" style="padding:32px 20px">'+

function renderCalendar(){
  var monthStart = state.calendarMonth;
  var year = monthStart.getFullYear(), month = monthStart.getMonth();
  var monthLabel = monthStart.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  var firstDay = new Date(year, month, 1);
  var startOffset = (firstDay.getDay()+6)%7;
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var todayStr = todayKey();
  var now = new Date();

  var dayData = {};
  allSessionsIncludingToday().forEach(function(s){
    var exs = s.data.exercises||[];
    if(!exs.length) return;
    var vol = 0;
    exs.forEach(function(e){ vol += volumeOf(e.sets); });
    dayData[s.data.date] = { count:exs.length, volume:vol };
  });

  var weekdayHeaders = ["M","T","W","T","F","S","S"].map(function(w){ return '<div class="cal-wd">'+w+"</div>"; }).join("");

  var cells = "";
  for(var i=0;i<startOffset;i++){ cells += '<div class="cal-cell cal-empty"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var d = new Date(year, month, day);
    var key = dateKey(d);
    var has = dayData[key];
    var isToday = key===todayStr;
    var isFuture = d.getTime() > now.getTime() && key!==todayStr;
    var cls = "cal-cell"+(isToday?" cal-today":"")+(has?" cal-has":"")+(isFuture?" cal-future":"")+(state.calendarSelectedDate===key?" cal-selected":"");
    cells += '<button type="button" class="'+cls+'" data-caldate="'+key+'"'+(isFuture?" disabled":"")+"><span>"+day+"</span></button>";
  }

  var monthDaysPassed=0, monthWorkouts=0;
  for(var day2=1; day2<=daysInMonth; day2++){
    var d2 = new Date(year,month,day2);
    if(d2.getTime() > now.getTime()) continue;
    monthDaysPassed++;
    if(dayData[dateKey(d2)]) monthWorkouts++;
  }

  var streak = streakCount();
  var longest = longestStreak();

  var detail = "";
  if(state.calendarSelectedDate){
    var sessionForDate = allSessionsIncludingToday().find(function(s){ return s.data.date===state.calendarSelectedDate; });
    var calDoneEx = sessionForDate ? completedExercises(sessionForDate.data) : [];
    if(calDoneEx.length){
      var calDuration = (sessionForDate.data.createdAt && sessionForDate.data.completedAt) ? formatDuration(new Date(sessionForDate.data.completedAt) - new Date(sessionForDate.data.createdAt)) : "";
      detail = '<div class="cal-detail">'+
        '<div class="cal-detail-date">'+fmtLong(state.calendarSelectedDate)+(calDuration?' <span style="font-family:var(--font-mono); font-weight:600; text-transform:none; letter-spacing:0; color:var(--text-dim); font-size:12px;">· '+calDuration+"</span>":"")+"</div>"+
        calDoneEx.map(function(e){
          var info = EX_BY_ID[e.exerciseId] || {name:e.name, muscle:""};
          var exCardio = info.muscle==="Cardio";
          var setsStr = formatSetsForDisplay(e.sets, exCardio);
          return '<div class="hist-ex"><div class="hist-ex-name-wrap">'+muscleIconSvg(info.muscle, true)+'<span class="hist-ex-name">'+info.name+'</span></div><div class="hist-ex-sets">'+setsStr+"</div></div>";
        }).join("")+
      "</div>";
    } else {
      detail = '<div class="cal-detail"><div class="cal-detail-date">'+fmtLong(state.calendarSelectedDate)+'</div><div class="hist-ex-sets" style="padding-top:4px; color:var(--text-dim)">'+(sessionForDate && (sessionForDate.data.exercises||[]).length ? "Workout logged, but no sets were ticked as done." : "No workout logged this day.")+"</div></div>";
    }
  }

  return '<div class="cal-stat-grid">'+
      '<div class="stat-tile"><div class="stat-label">Streak</div><div class="stat-value">'+streak+' <small>days</small></div></div>'+
      '<div class="stat-tile"><div class="stat-label">Longest</div><div class="stat-value">'+longest+' <small>days</small></div></div>'+
      '<div class="stat-tile"><div class="stat-label">This Month</div><div class="stat-value">'+monthWorkouts+'<small>/'+monthDaysPassed+"</small></div></div>"+
    "</div>"+
    '<div class="cal-card">'+
      '<div class="cal-nav">'+
        '<button class="icon-btn" id="calPrev">'+icon("chevronleft")+"</button>"+
        '<div class="cal-month-label">'+monthLabel+"</div>"+
        '<button class="icon-btn" id="calNext">'+icon("chevronright")+"</button>"+
      "</div>"+
      '<div class="cal-grid cal-weekdays">'+weekdayHeaders+"</div>"+
      '<div class="cal-grid">'+cells+"</div>"+
    "</div>"+
    detail;
}

function bindCustomExtras(){
  var toggle = document.getElementById("customExToggle");
  if(toggle) toggle.addEventListener("click", function(){ state.picker.customFormOpen = true; state.picker.customName=""; refreshCurrentList(); });
  var cancel = document.getElementById("customExCancel");
  if(cancel) cancel.addEventListener("click", function(){ state.picker.customFormOpen = false; refreshCurrentList(); });
  var nameInp = document.getElementById("customExName");
  if(nameInp) nameInp.addEventListener("input", function(){ state.picker.customName = nameInp.value; });
  var muscleSel = document.getElementById("customExMuscle");
  if(muscleSel) muscleSel.addEventListener("change", function(){ state.picker.customMuscle = muscleSel.value; });
  var equipSel = document.getElementById("customExEquip");
  if(equipSel) equipSel.addEventListener("change", function(){ state.picker.customEquip = equipSel.value; });
  var save = document.getElementById("customExSave");
  if(save) save.addEventListener("click", function(){
    var name = document.getElementById("customExName").value.trim();
    if(!name){ toast("Enter a name first"); return; }
    var muscle = document.getElementById("customExMuscle").value;
    var equip = document.getElementById("customExEquip").value;
    Promise.resolve(createCustomExercise(name, muscle, equip)).then(function(obj){
      if(!obj) return;
      state.picker.customFormOpen = false;
      var targetLabel = "today";
      if(state.picker.target==="program"){ addExerciseToBuilder(obj.id); targetLabel="program"; }
      else if(state.picker.target==="editSession"){ addExerciseToEditor(obj.id); targetLabel="session"; }
      else { addExerciseToToday(obj.id, true); }
      state.picker.justAdded[obj.id] = true;
      toast(obj.name+" created and added to "+targetLabel);
      refreshCurrentList();
      updateStreakChipOnly();
    });
  });

function addExerciseToToday(exId, silent){
  ensureToday();
  var info = EX_BY_ID[exId];
  var exists = state.today.exercises.find(function(e){ return e.exerciseId===exId; });
  if(exists){ if(!silent) toast(info.name+" already in today’s session"); return; }
  var last = lastEntryFor(exId, false);
  var cardio = info.muscle==="Cardio";
  var sets;
  if(last){
    sets = cardio
      ? last.sets.slice(0,10).map(function(s){ return { duration:s.duration, distance:s.distance, done:false }; })
      : last.sets.slice(0,10).map(function(s){ return { reps:s.reps, weight:s.weight, done:false }; });
  } else {
    sets = cardio ? [{ duration:20, distance:0, done:false }] : [{ reps:8, weight:0, done:false }];
  }
  state.today.exercises.push({ exerciseId: exId, name: info.name, sets: sets });
  scheduleSave();
  if(!silent) toast(info.name+" added to today");
}
function addExerciseToBuilder(exId){
  if(!state.programBuilder) return;
  var exists = state.programBuilder.exercises.find(function(x){ return x.exerciseId===exId; });
  if(exists){ toast("Already in this program"); return; }
  var info = EX_BY_ID[exId];
  state.programBuilder.exercises.push({ exerciseId: exId, name: info.name, targetSets: 3, targetReps: 8 });
}

function addExerciseToEditor(exId){
  if(!state.editingSession) return;
  var exists = state.editingSession.data.exercises.find(function(x){ return x.exerciseId===exId; });
  if(exists){ toast("Already in this session"); return; }
  var info = EX_BY_ID[exId];
  var cardio = info.muscle==="Cardio";
  var sets = cardio ? [{ duration:20, distance:0, done:true }] : [{ reps:8, weight:0, done:true }];
  state.editingSession.data.exercises.push({ exerciseId: exId, name: info.name, sets: sets });
}

function attachSheetHandlers(){
  bindSheetSearchAndChips(false);
  bindAddButtons(document.getElementById("sheetBody"));
  bindCustomExtras(document.getElementById("sheetBody"));
  document.getElementById("sheetClose").addEventListener("click", closePicker);
  document.getElementById("sheetDone").addEventListener("click", function(){ closePicker(); render(); });
}
function focusEnd(el){ var v=el.value; el.focus(); el.value=""; el.value=v; }
function bindSheetSearchAndChips(refocus){
  var search = document.getElementById("sheetSearch");
  search.addEventListener("input", function(){ state.picker.query = search.value; refreshSheetBody(true); });
  if(refocus) focusEnd(search);
  document.getElementById("sheetChips").querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){ state.picker.muscle = c.dataset.muscle; refreshSheetBody(false); });
  });
}
function refreshSheetBody(refocusSearch){
  var oldChips = document.getElementById("sheetChips");
  var chipScroll = oldChips ? oldChips.scrollLeft : 0;
  document.getElementById("sheetBody").innerHTML = exerciseListHTML("sheet");
  bindAddButtons(document.getElementById("sheetBody"));
  bindCustomExtras(document.getElementById("sheetBody"));
  bindSheetSearchAndChips(!!refocusSearch);
  var newChips = document.getElementById("sheetChips");
  if(newChips) newChips.scrollLeft = chipScroll;
}
function bindAddButtons(root){
  root.querySelectorAll("[data-add]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.dataset.add;
      if(state.picker.target==="program"){ addExerciseToBuilder(id); }
      else if(state.picker.target==="editSession"){ addExerciseToEditor(id); }
      else { addExerciseToToday(id, true); }
      state.picker.justAdded[id] = true;
      btn.textContent = "Added"; btn.classList.add("added");
      updateStreakChipOnly();
    });
  });
}
function bindDeleteButtons(root){
  root.querySelectorAll("[data-delex]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.dataset.delex;
      var info = EX_BY_ID[id];
      var name = info ? info.name : "this exercise";
      showConfirm('Remove "'+name+'" from your exercise library? Past workouts that used it keep their history.', "Remove", function(){
        var isCustom = state.customExercises.some(function(e){ return e.id===id; });
        if(isCustom){ deleteCustomExercise(id); } else { hideBuiltInExercise(id); }
        toast(name+" removed from your library");
        refreshCurrentList();
      });
    });
  });
}
function updateStreakChipOnly(){
  var streak = streakCount();
  var chip = document.getElementById("streakChip");
  if(chip){ if(streak>0){ chip.hidden=false; chip.innerHTML = icon("flame")+"<span>"+streak+'<span class="streak-word"> day streak</span></span>'; } else chip.hidden=true; }
}

var dragCtx = null;

function bindDragReorder(container, getArray, onDone){
  if(!container) return;
  container.querySelectorAll(".drag-handle").forEach(function(handle){
    handle.addEventListener("pointerdown", function(ev){
      if(ev.button!==undefined && ev.button!==0) return;
      ev.preventDefault();
      var row = handle.closest("[data-drag-id]");
      if(!row) return;
      var arr = getArray();
      var dragId = row.dataset.dragId;
      var startIndex = arr.findIndex(function(x){ return x.exerciseId===dragId; });
      if(startIndex<0) return;
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
      container.classList.add("reorder-mode");
      var scroller = findScrollParent(container);
      var rr0 = row.getBoundingClientRect();
      var drift = (rr0.top + rr0.height/2) - ev.clientY;
      if(drift){ if(scroller) scroller.scrollTop += drift; else window.scrollBy(0, drift); }
      var rows = Array.prototype.slice.call(container.querySelectorAll("[data-drag-id]"));
      var siblings = rows.map(function(r){
        var rr = r.getBoundingClientRect();
        return { el:r, top:rr.top, height:rr.height };
      });
      var rrNow = row.getBoundingClientRect();
      var grabOffset = (rrNow.top + rrNow.height/2) - ev.clientY;
      var scroll0 = getScrollPos(scroller);
      siblings.forEach(function(s){ s.top += scroll0; });
      var self = siblings[startIndex];
      var pitch = siblings.length>1 ? (siblings[1].top - siblings[0].top) : self.height;
      dragCtx = {
        arr: arr,
        container: container,
        scroller: scroller,
        startIndex: startIndex,
        currentIndex: startIndex,
        origCenter: self.top + self.height/2,
        grabOffset: grabOffset,
        pitch: pitch,
        siblings: siblings,
        row: row,
        onDone: onDone,
        lastY: ev.clientY,
        raf: 0
      };
      row.classList.add("dragging");
      positionDraggedRow(ev.clientY);
      dragCtx.raf = requestAnimationFrame(autoScrollTick);
      try{ handle.setPointerCapture(ev.pointerId); }catch(err){}
      handle.addEventListener("pointermove", onGenericDragMove);
      handle.addEventListener("pointerup", onGenericDragEnd);
      handle.addEventListener("pointercancel", onGenericDragEnd);
    });
  });
}

function findScrollParent(el){
  var p = el;
  while(p && p!==document.body && p!==document.documentElement){
    var oy = getComputedStyle(p).overflowY;
    if((oy==="auto" || oy==="scroll") && p.scrollHeight > p.clientHeight) return p;
    p = p.parentElement;
  }
  return null;
}
function getScrollPos(scroller){ return scroller ? scroller.scrollTop : window.scrollY; }

function autoScrollTick(){
  var c = dragCtx;
  if(!c) return;
  var topEdge, bottomEdge;
  if(c.scroller){
    var r = c.scroller.getBoundingClientRect();
    topEdge = r.top; bottomEdge = r.bottom;
  } else {
    var tb = document.querySelector(".topbar"), nb = document.querySelector(".tabbar");
    topEdge = tb ? tb.getBoundingClientRect().bottom : 0;
    bottomEdge = nb ? nb.getBoundingClientRect().top : window.innerHeight;
  }
  var zone = 70, maxSpeed = 7, dy = 0;
  if(c.lastY < topEdge + zone) dy = -maxSpeed * Math.min(1, (topEdge + zone - c.lastY)/zone);
  else if(c.lastY > bottomEdge - zone) dy = maxSpeed * Math.min(1, (c.lastY - (bottomEdge - zone))/zone);
  if(dy){
    var before = getScrollPos(c.scroller);
    if(c.scroller) c.scroller.scrollTop += dy; else window.scrollBy(0, dy);
    if(getScrollPos(c.scroller) !== before) positionDraggedRow(c.lastY);
  }
  c.raf = requestAnimationFrame(autoScrollTick);
}

function positionDraggedRow(clientY){
  var c = dragCtx;
  var y = clientY + c.grabOffset + getScrollPos(c.scroller);
  c.row.style.transform = "translateY("+(y - c.origCenter)+"px)";
  var newIndex = 0;
  c.siblings.forEach(function(s, i){
    if(i===c.startIndex) return;
    if((s.top + s.height/2) < y) newIndex++;
  });
  c.currentIndex = newIndex;
  c.siblings.forEach(function(s, i){
    if(i===c.startIndex) return;
    var shift = 0;
    if(c.startIndex < newIndex){ if(i>c.startIndex && i<=newIndex) shift = -1; }
    else if(newIndex < c.startIndex){ if(i>=newIndex && i<c.startIndex) shift = 1; }
    s.el.style.transform = shift ? "translateY("+(shift*c.pitch)+"px)" : "";
  });
}

function onGenericDragMove(ev){
  if(!dragCtx) return;
  ev.preventDefault();
  dragCtx.lastY = ev.clientY;
  positionDraggedRow(ev.clientY);
}

function onGenericDragEnd(ev){
  if(!dragCtx) return;
  var handle = ev.currentTarget;
  handle.removeEventListener("pointermove", onGenericDragMove);
  handle.removeEventListener("pointerup", onGenericDragEnd);
  handle.removeEventListener("pointercancel", onGenericDragEnd);
  cancelAnimationFrame(dragCtx.raf);
  var arr = dragCtx.arr;
  var item = arr.splice(dragCtx.startIndex,1)[0];
  arr.splice(dragCtx.currentIndex,0,item);
  dragCtx.container.classList.remove("reorder-mode");
  var onDone = dragCtx.onDone;
  dragCtx = null;
  if(onDone) onDone();
}

function startProgram(program){
  ensureToday();
  var added = 0;
  program.exercises.forEach(function(pe){
    var exists = state.today.exercises.find(function(e){ return e.exerciseId===pe.exerciseId; });
    if(exists) return;
    var last = lastEntryFor(pe.exerciseId, false);
    var sets = [];
    if(isCardioExercise(pe.exerciseId)){
      for(var i=0;i<pe.targetSets;i++){ sets.push({ duration: pe.targetReps, distance:0, done:false }); }
    } else {
      var baseWeight = last ? topSet(last.sets).weight : 0;
      for(var j=0;j<pe.targetSets;j++){ sets.push({ reps: pe.targetReps, weight: baseWeight, done:false }); }
    }
    var info = EX_BY_ID[pe.exerciseId] || {name:pe.name};
    state.today.exercises.push({ exerciseId: pe.exerciseId, name: info.name, sets: sets });
    added++;
  });
  state.today.programName = program.name;
  scheduleSave();
  state.tab = "log";
  render();
  toast(added ? ("Started "+program.name) : "All exercises already logged today");
}

var CAN_IMPORT = !window.claude; /* phone app (no Claude runtime) can import; the claude.ai version only exports */

async function gatherExport(){
  var sessions = state.sessions.slice();
  var programs = state.programs.slice();
  var customs = state.customExercises.slice();
  /* Start from what the app has loaded, then add anything extra the database returns.
     A database read can only ADD to the export, never empty it. */
  function mergeById(base, extra){
    var byId = {};
    base.forEach(function(x){ byId[x.id] = x; });
    extra.forEach(function(x){ if(x && x.id) byId[x.id] = x; });
    return Object.keys(byId).map(function(k){ return byId[k]; });
  }
  if(dbNs){
    try{
      var ss = await sessionsCol().limit(1000).get();
      sessions = mergeById(sessions, ss.docs.map(function(d){ return {id:d.id, data:d.data()}; }));
    }catch(e){}
    try{
      var ps = await programsCol().limit(1000).get();
      programs = mergeById(programs, ps.docs.map(function(d){ return {id:d.id, data:d.data()}; }));
    }catch(e){}
    try{
      var cs = await customCol().limit(1000).get();
      customs = mergeById(customs, cs.docs.map(function(d){ var x=d.data(); return {id:d.id, name:x.name, muscle:x.muscle, equip:x.equip}; }));
    }catch(e){}
  }
  sessions = sessions.filter(function(s){ return s && s.data && s.data.date; });
  sessions.sort(function(a,b){ return a.data.date < b.data.date ? 1 : -1; });
  if(state.today && state.today.exercises.length){
    var tid = state.todayId || "__today__";
    var copy = JSON.parse(JSON.stringify(state.today));
    var i = sessions.findIndex(function(s){ return s.id===tid; });
    if(i>-1) sessions[i] = {id:tid, data:copy}; else sessions.unshift({id:tid, data:copy});
  }
  return {
    app:"RepLedger", format:1, exportedAt:new Date().toISOString(),
    unit: state.unit,
    sessions: sessions, programs: programs,
    customExercises: customs, hiddenBuiltIns: state.hiddenBuiltIns.slice()
  };
}

async function saveTextFile(filename, text){
  if(window.claude && window.claude.use){
    var dl = null;
    try{ dl = await window.claude.use("downloads"); }catch(e){}
    if(dl){
      try{ await dl.save({filename:filename, data:text}); return "saved"; }
      catch(err){ if(err && err.code==="declined") return "declined"; throw err; }
    }
  }
  var blob = new Blob([text], {type:"application/json"});
  if(navigator.canShare && window.File){
    try{
      var file = new File([blob], filename, {type:"application/json"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return "saved"; }
    }catch(e){ if(e && e.name==="AbortError") return "declined"; }
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  return "saved";
}

async function exportData(){
  var data = await gatherExport();
  if(!data.sessions.length && !data.programs.length){
    toast("Nothing to export yet: no sessions or programs found");
    return;
  }
  var name = "repledger-backup-"+todayKey()+".json";
  try{
    var r = await saveTextFile(name, JSON.stringify(data, null, 1));
    if(r==="saved") toast("Backup saved: "+data.sessions.length+" sessions");
  }catch(e){ toast("Couldn't save the file"); }
}

function importFromObject(obj){
  if(!obj || obj.app!=="RepLedger" || !Array.isArray(obj.sessions)) throw new Error("bad file");
  var sess = {};
  obj.sessions.forEach(function(s){
    if(!s || !s.data || !s.data.date) return;
    var id = (s.id && s.id!=="__today__") ? s.id : uid();
    sess[id] = s.data;
  });
  var progs = {};
  (obj.programs||[]).forEach(function(p){ if(p && p.data && p.data.name) progs[p.id||("p"+uid())] = p.data; });
  localStorage.setItem(LS_KEY, JSON.stringify(sess));
  localStorage.setItem(PROGRAMS_LS_KEY, JSON.stringify(progs));
  localStorage.setItem(CUSTOM_LS_KEY, JSON.stringify(obj.customExercises||[]));
  localStorage.setItem(HIDDEN_LS_KEY, JSON.stringify(obj.hiddenBuiltIns||[]));
  if(obj.unit==="kg" || obj.unit==="lb"){ localStorage.setItem("repledger_unit", obj.unit); state.unit = obj.unit; }
  loadLocal(); loadLocalCustom(); loadLocalPrograms(); loadLocalHidden();
  state.today = null; state.todayId = null; ensureToday();
  return Object.keys(sess).length;
}

function pickImportFile(){
  var input = document.createElement("input");
  input.type = "file"; input.accept = ".json,application/json";
  input.addEventListener("change", function(){
    var f = input.files && input.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var obj;
      try{ obj = JSON.parse(reader.result); if(!obj || obj.app!=="RepLedger") throw 0; }
      catch(e){ toast("That isn't a RepLedger backup file"); return; }
      showConfirm("Import "+obj.sessions.length+" sessions from this backup? Everything currently on this phone will be replaced.", "Import", function(){
        try{
          var n = importFromObject(obj);
          closePicker(); render();
          toast("Imported "+n+" sessions");
        }catch(e){ toast("Import failed: file looks damaged"); }
      });
    };
    reader.readAsText(f);
  });
  input.click();
}

function openDataSheet(){
  var nSess = state.sessions.filter(function(s){ return (s.data.exercises||[]).length; }).length;
  var overlay = document.getElementById("sheetOverlay");
  overlay.hidden = false;
  overlay.innerHTML = '<div class="sheet">'+
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-head"><span class="sheet-title">Backup &amp; Data</span><button class="icon-btn" id="dataClose">'+icon("close")+"</button></div>"+
    '<div class="sheet-body">'+
      '<div class="data-counts">'+nSess+" sessions · "+state.programs.length+" programs · "+state.customExercises.length+" custom exercises</div>"+
      '<div class="data-section"><div class="field-label">Export</div>'+
        "<p>Download everything (sessions, programs, custom exercises) as one backup file. "+(CAN_IMPORT?"Save it to Google Drive now and then so you never lose your history.":"Import this file in the RepLedger phone app to move your history over.")+"</p>"+
        '<button class="btn btn-accent" id="exportBtn">Export backup</button></div>'+
      (CAN_IMPORT ?
        '<div class="data-section"><div class="field-label">Import</div>'+
        "<p>Restore from a backup file. This replaces all data currently on this phone.</p>"+
        '<button class="btn btn-outline" id="importBtn">Import backup</button></div>' : "")+
    "</div>"+
  "</div>";
  document.getElementById("dataClose").addEventListener("click", closePicker);
  document.getElementById("exportBtn").addEventListener("click", exportData);
  var ib = document.getElementById("importBtn");
  if(ib) ib.addEventListener("click", pickImportFile);
}
document.getElementById("dataBtn").addEventListener("click", openDataSheet);

document.getElementById("fab").addEventListener("click", openPicker);
document.querySelectorAll(".tab-btn").forEach(function(b){
  b.addEventListener("click", function(){ state.tab = b.dataset.tab; render(); scrollAppToTop(); });
});
document.querySelectorAll("#unitToggle button").forEach(function(b){
  b.addEventListener("click", function(){ state.unit = b.dataset.unit; localStorage.setItem("repledger_unit", state.unit); render(); });
});
document.getElementById("sheetOverlay").addEventListener("click", function(ev){ if(ev.target.id==="sheetOverlay") closePicker(); });

initStorage();
})();
</script>
